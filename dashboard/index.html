<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snapsift</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%23c2412f'/%3E%3Crect x='6' y='6' width='12' height='12' rx='2' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <span class="mx-logo"><i data-icon="images"></i>snapsift</span>
  <span class="mx-pill" id="pill"><span class="dot"></span><span id="pilltext">Loading</span></span>
  <span class="spacer"></span>
  <button class="mx-icon" id="theme" aria-label="Switch to dark mode"></button>
  <button class="mx-btn" id="btnNew" hidden><i data-icon="plus"></i>New sort</button>
  <button class="mx-btn solid" id="go"><i data-icon="play"></i><span>Sort with Claude</span></button>
</header>

<main class="app" id="app">
  <div class="mx-title">
    <h1>Sorting my camera roll</h1>
    <span class="mx-count" id="total" hidden>0</span>
    <span class="mx-sub" id="source"></span>
    <span class="spacer"></span>
    <button class="mx-btn small" id="btnFolders"><i data-icon="pencil"></i>Edit folders</button>
    <button class="mx-btn small" id="btnOpen" hidden><i data-icon="folder"></i>Open sorted folder</button>
  </div>

  <nav class="tools" id="tools" hidden aria-label="Tools">
    <label class="search"><i data-icon="search"></i><input id="q" type="search" placeholder="Search: beach, 2023, passport, receipt…" aria-label="Search your photos" autocomplete="off"></label>
    <button class="mx-btn small" id="tAccounts" hidden><i data-icon="users"></i>Accounts</button>
    <button class="mx-btn small" id="tClean"><i data-icon="broom"></i>Clean up</button>
    <button class="mx-btn small" id="tTrips"><i data-icon="compass"></i>Trips &amp; events</button>
    <button class="mx-btn small" id="tMap"><i data-icon="map"></i>Map</button>
    <button class="mx-btn small" id="tHigh"><i data-icon="film"></i>Highlights</button>
    <button class="mx-btn small" id="tShare"><i data-icon="upload"></i>Upload</button>
    <button class="mx-btn small" id="tPrivacy"><i data-icon="lock"></i>Privacy</button>
  </nav>

  <section class="mx-kpis" style="--n:6">
    <div class="mx-kpi"><h3>Files checked</h3><b id="k-checked">0</b><small id="k-checked-s">photos &amp; videos</small></div>
    <div class="mx-kpi"><h3>Photos sorted</h3><b id="k-photos">0</b><small>&nbsp;</small></div>
    <div class="mx-kpi"><h3>Videos sorted</h3><b id="k-videos">0</b><small>&nbsp;</small></div>
    <div class="mx-kpi"><h3>Folders made</h3><b><span id="k-folders">0</span><span class="of">/<span id="k-ftotal">0</span></span></b><small>&nbsp;</small></div>
    <div class="mx-kpi"><h3>Duplicates</h3><b id="k-dupes">0</b><small>moved to review</small></div>
    <div class="mx-kpi"><h3>Space saved</h3><b id="k-saved">0 MB</b><small>if you delete them</small></div>
    <div class="progress"><i id="bar"></i></div>
  </section>

  <section class="board">
    <div class="col"><div class="col-h"><span>Photos</span><em id="pcount">0</em></div><div class="cards" id="photos"></div></div>
    <div class="stage" id="stage">
      <div class="center" id="done">
        <div class="check"><i data-icon="check"></i></div>
        <div class="big"><span id="bigN">0</span> sorted</div>
        <div class="mx-sub">into <b id="bigF">0 folders</b> with one prompt</div>
        <div class="chips"><span class="chip" id="chipD"></span><span class="chip" id="chipS"></span></div>
      </div>
      <div class="panel" id="panel"></div>
    </div>
    <div class="col right"><div class="col-h"><span>Videos</span><em id="vcount">0</em></div><div class="cards" id="videos"></div></div>
  </section>
</main>

<div id="sphere"></div>
<div id="fly"></div>
<canvas id="confetti"></canvas>
<div id="overlay"></div>
<div class="toast" id="toast" role="status"></div>
<div class="jobpill" id="jobpill" role="status" hidden><span class="spin"></span><span id="jobtext"></span><i class="jbar"><b id="jobbar"></b></i><button class="mx-icon" id="jobstop" aria-label="Stop"></button></div>
<script src="app.js"></script>
</body>
</html>
