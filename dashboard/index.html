<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snapsift</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237b5cff'/%3E%3Cstop offset='.55' stop-color='%234f7cff'/%3E%3Cstop offset='1' stop-color='%231fb6c9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M16 7l2.2 6.8L25 16l-6.8 2.2L16 25l-2.2-6.8L7 16l6.8-2.2z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="bg-mesh" aria-hidden="true"></div>
<div class="shell">
  <aside class="rail" id="tools" aria-label="Snapsift">
    <a class="brand" href="/" aria-label="Snapsift home"><span class="mark"><i data-icon="spark"></i></span><span class="word">Snapsift</span></a>
    <nav class="nav">
      <button class="nav-i on" id="tLibrary" data-tip="Library"><i data-icon="images"></i><span>Library</span></button>
      <button class="nav-i" id="tSearch" data-tip="Search · ⌘K"><i data-icon="search"></i><span>Search</span></button>
      <button class="nav-i" id="tAccounts" data-tip="Accounts" hidden><i data-icon="users"></i><span>Accounts</span></button>
      <button class="nav-i" id="tClean" data-tip="Clean up"><i data-icon="broom"></i><span>Clean up</span><em class="dotn" id="nClean" hidden></em></button>
      <button class="nav-i" id="tTrips" data-tip="Trips & events"><i data-icon="compass"></i><span>Trips</span></button>
      <button class="nav-i" id="tMap" data-tip="Map"><i data-icon="map"></i><span>Map</span></button>
      <button class="nav-i" id="tHigh" data-tip="Highlights"><i data-icon="film"></i><span>Highlights</span></button>
      <button class="nav-i" id="tShare" data-tip="Upload"><i data-icon="upload"></i><span>Upload</span></button>
    </nav>
    <div class="rail-foot">
      <button class="nav-i" id="tPrivacy" data-tip="Privacy"><i data-icon="lock"></i><span>Privacy</span></button>
      <button class="nav-i" id="theme" data-tip="Theme" aria-label="Switch to dark mode"></button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="crumbs">
        <h1 id="libname">Snapsift</h1>
        <span class="mx-count" id="total" hidden>0</span>
        <span class="mx-sub" id="source"></span>
      </div>
      <button class="searchbox" id="q" aria-label="Search photos, folders and tools"><i data-icon="search"></i><span>Search photos, folders, tools…</span><kbd>⌘K</kbd></button>
      <span class="spacer"></span>
      <span class="mx-pill" id="pill"><span class="dot"></span><span id="pilltext">Loading</span></span>
      <button class="mx-btn small ghost" id="btnFolders"><i data-icon="pencil"></i><span>Edit folders</span></button>
      <button class="mx-btn small ghost" id="btnOpen" hidden><i data-icon="folder"></i><span>Open in Finder</span></button>
      <button class="mx-btn small" id="btnNew" hidden><i data-icon="plus"></i><span>New sort</span></button>
      <button class="mx-btn solid grad" id="go"><i data-icon="play"></i><span>Sort with Claude</span></button>
    </header>

    <main class="app" id="app">
      <section class="mx-kpis" aria-label="Summary">
        <div class="mx-kpi"><i class="ki" data-icon="images"></i><div><h3>Files checked</h3><b id="k-checked">0</b><small id="k-checked-s">photos &amp; videos</small></div></div>
        <div class="mx-kpi"><i class="ki" data-icon="photo"></i><div><h3>Photos sorted</h3><b id="k-photos">0</b><small>&nbsp;</small></div></div>
        <div class="mx-kpi"><i class="ki" data-icon="film"></i><div><h3>Videos sorted</h3><b id="k-videos">0</b><small>&nbsp;</small></div></div>
        <div class="mx-kpi"><i class="ki" data-icon="folder"></i><div><h3>Folders</h3><b><span id="k-folders">0</span><span class="of">/<span id="k-ftotal">0</span></span></b><small>&nbsp;</small></div></div>
        <div class="mx-kpi"><i class="ki" data-icon="copy"></i><div><h3>Duplicates</h3><b id="k-dupes">0</b><small>moved to review</small></div></div>
        <div class="mx-kpi"><i class="ki" data-icon="disk"></i><div><h3>Space to free</h3><b id="k-saved">0 MB</b><small>if you delete them</small></div></div>
        <div class="progress"><i id="bar"></i></div>
      </section>

      <section class="board">
        <div class="col"><div class="col-h"><span>Photos</span><em id="pcount">0</em></div><div class="cards" id="photos"></div></div>
        <div class="stage" id="stage">
          <div class="center" id="done">
            <div class="donut-wrap">
              <svg id="donut" viewBox="0 0 120 120" aria-hidden="true"></svg>
              <div class="donut-mid"><b id="bigN">0</b><span id="bigL">sorted</span></div>
            </div>
            <div class="mx-sub">into <b id="bigF">0 folders</b> with one prompt</div>
            <div class="chips"><button class="chip" id="chipD"></button><button class="chip" id="chipS"></button></div>
            <div class="legend" id="legend"></div>
            <button class="mx-btn small ghost" id="btnReplay"><i data-icon="play"></i><span>Replay</span></button>
          </div>
          <div class="panel" id="panel"></div>
        </div>
        <div class="col right"><div class="col-h"><span>Videos &amp; review</span><em id="vcount">0</em></div><div class="cards" id="videos"></div></div>
      </section>
    </main>
  </div>
</div>

<div id="sphere"></div>
<div id="fly"></div>
<canvas id="confetti"></canvas>
<div id="overlay"></div>
<div class="toast" id="toast" role="status"></div>
<div class="jobpill" id="jobpill" role="status" hidden><span class="spin"></span><span id="jobtext"></span><i class="jbar"><b id="jobbar"></b></i><button class="mx-icon" id="jobstop" aria-label="Stop"></button></div>
<script src="app.js"></script>
</body>
</html>
